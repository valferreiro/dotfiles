add_newline = true

format = """
╭─$username$hostname$directory$git_branch$git_status
╰─$character
"""

[character]
success_symbol = "[❯](bold pink)"
error_symbol = "[❯](bold red)"

[directory]
style = "bold cyan"
truncation_length = 4
truncate_to_repo = false

[git_branch]
symbol = " "
style = "bold purple"

[git_status]
style = "bold yellow"

[username]
show_always = true
style_user = "bold pink"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "bold blue"
format = "[@$hostname]($style) "
